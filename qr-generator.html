<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moraine State Park - Bluebird Box QR Code Generator</title>
  <style>
    :root {
      --primary: #1b4332;
      --primary-light: #2d6a4f;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 20px;
    }

    .no-print {
      max-width: 800px;
      margin: 0 auto 20px auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 6px; }
    p { color: #64748b; font-size: 0.9rem; margin-bottom: 16px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    label { font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px; }
    input, select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
    }

    .btn-group { display: flex; gap: 10px; }
    .btn {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .btn-primary { background: var(--primary); color: #ffffff; }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-secondary { background: #e2e8f0; color: #334155; }

    /* Printable Grid Layout */
    .print-sheet {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .box-label {
      background: #ffffff;
      border: 2px dashed #94a3b8;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      page-break-inside: avoid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 280px;
    }

    .label-header {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      border-bottom: 1.5px solid var(--primary);
      padding-bottom: 4px;
      width: 100%;
      margin-bottom: 8px;
    }

    .label-box-num {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .label-trail {
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }

    .qr-holder {
      padding: 6px;
      background: #ffffff;
      border-radius: 6px;
      display: inline-block;
    }

    .qr-holder img, .qr-holder canvas {
      display: block;
      margin: 0 auto;
    }

    .label-footer {
      font-size: 0.68rem;
      color: #64748b;
      margin-top: 8px;
      line-height: 1.2;
    }

    @media print {
      body { background: #ffffff; padding: 0; }
      .no-print { display: none !important; }
      .print-sheet {
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        max-width: 100%;
      }
      .box-label {
        border: 1px solid #000000;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>

  <div class="no-print">
    <h1>🐦 Moraine Bluebird Box QR Code Generator</h1>
    <p>Generate printable, weatherproof QR code labels for boxes along the Moraine State Park Bluebird Trail.</p>

    <div class="form-grid">
      <div>
        <label for="appUrl">PWA Web App Base URL</label>
        <input type="text" id="appUrl" value="./index.html" placeholder="https://yourname.github.io/moraine-birds/">
      </div>
      <div>
        <label for="trailName">Trail / Area Name</label>
        <input type="text" id="trailName" value="North Shore Trail">
      </div>
      <div>
        <label for="prefix">Box Prefix</label>
        <input type="text" id="prefix" value="Box ">
      </div>
      <div>
        <label for="startNum">Start Number</label>
        <input type="number" id="startNum" value="1" min="1" max="500">
      </div>
      <div>
        <label for="endNum">End Number</label>
        <input type="number" id="endNum" value="20" min="1" max="500">
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" id="btnGenerate">Generate Labels</button>
      <button class="btn btn-secondary" onclick="window.print()">🖨️ Print Labels</button>
    </div>
  </div>

  <!-- Container for rendered labels -->
  <div class="print-sheet" id="labelContainer"></div>

  <script src="lib/qrcode.min.js"></script>
  <script>
    function generateLabels() {
      const appUrl = (document.getElementById('appUrl').value || './index.html').trim();
      const trail = document.getElementById('trailName').value.trim();
      const prefix = document.getElementById('prefix').value;
      const start = parseInt(document.getElementById('startNum').value || '1', 10);
      const end = parseInt(document.getElementById('endNum').value || '20', 10);

      const container = document.getElementById('labelContainer');
      container.innerHTML = '';

      for (let i = start; i <= end; i++) {
        const boxId = `${prefix}${i}`;
        
        // Build QR link
        const cleanBase = appUrl.endsWith('/') ? appUrl : (appUrl.includes('.html') ? appUrl : appUrl + '/');
        const sep = cleanBase.includes('?') ? '&' : '?';
        const targetUrl = `${cleanBase}${sep}box=${encodeURIComponent(boxId)}&trail=${encodeURIComponent(trail)}`;

        const card = document.createElement('div');
        card.className = 'box-label';

        const qrId = `qrcode_${i}`;

        card.innerHTML = `
          <div class="label-header">Moraine State Park • Bluebirds</div>
          <div class="label-box-num">${boxId}</div>
          <div class="label-trail">${trail}</div>
          <div class="qr-holder" id="${qrId}"></div>
          <div class="label-footer">
            Scan with phone camera to log check.<br>
            <strong>Works 100% offline in park.</strong>
          </div>
        `;

        container.appendChild(card);

        // Generate QR code
        new QRCode(document.getElementById(qrId), {
          text: targetUrl,
          width: 140,
          height: 140,
          colorDark: "#1b4332",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      }
    }

    document.getElementById('btnGenerate').addEventListener('click', generateLabels);
    // Initial run
    generateLabels();
  </script>
</body>
</html>
